<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Security Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-box {
            transition: 0.3s;
        }

        .card-box:hover {
            transform: scale(1.03);
        }

        .navbar {
            background: #111827 !important;
        }

        .stat-box {
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-title {
            font-size: 14px;
            opacity: 0.7;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        table {
            color: white;
        }

        .table thead {
            color: #9ca3af;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark px-3 py-3">

    <span class="navbar-brand fw-bold">
        🛡️ Secure File Integrity System
    </span>

    <div>

        <a href="/verify" class="btn btn-warning btn-sm">
            Verify
        </a>

        <a href="/logout" class="btn btn-danger btn-sm">
            Logout
        </a>

    </div>

</nav>

<div class="container mt-4">

    <!-- STATS -->
    <div class="row g-3">

        <div class="col-md-4">
            <div class="glass stat-box card-box">
                <div class="stat-title">Total Files</div>
                <div class="stat-number">{{ files|length }}</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="glass stat-box card-box">
                <div class="stat-title">System Status</div>
                <div class="stat-number text-success">ACTIVE</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="glass stat-box card-box">
                <div class="stat-title">Security Level</div>
                <div class="stat-number text-warning">HIGH</div>
            </div>
        </div>

    </div>

    <!-- UPLOAD + TABLE -->
    <div class="row mt-4 g-3">

        <!-- UPLOAD -->
        <div class="col-md-4">

            <div class="glass p-3 card-box">

                <h5>📁 Upload File</h5>

                <form action="/upload" method="POST" enctype="multipart/form-data">

                    <input type="file" name="file" class="form-control mt-3" required>

                    <button class="btn btn-primary w-100 mt-3">
                        Upload & Generate Hash
                    </button>

                </form>

            </div>

        </div>

        <!-- TABLE -->
        <div class="col-md-8">

            <div class="glass p-3 card-box">

                <h5>📊 File Integrity Records</h5>

                <div class="table-responsive mt-3">

                    <table class="table table-dark table-hover">

                        <thead>

                            <tr>
                                <th>Filename</th>
                                <th>SHA-256 Hash</th>
                                <th>Date</th>
                            </tr>

                        </thead>

                        <tbody>

                            {% for file in files %}

                            <tr>

                                <td>{{ file[0] }}</td>

                                <td style="font-size:12px;">
                                    {{ file[1] }}
                                </td>

                                <td>
                                    {{ file[2] }}
                                </td>

                            </tr>

                            {% endfor %}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
